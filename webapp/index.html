<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>出题老师 · 工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell">
  <header class="top"><div><div class="eyebrow">基于教材与试卷资料的数学练习工作台</div><h1>出题老师<span class="title-dot">.</span></h1><p>给一个知识点，出一组有依据的题；给一道错题，练透同一种方法。</p></div><div class="math-mark" aria-hidden="true"><div class="axis-x"></div><div class="axis-y"></div><div class="orbit"></div><div class="slope"></div><div class="origin"></div></div></header>
  <section class="stats" aria-label="资料库状态"><div><strong id="sourceCount">—</strong><span>已保存来源</span></div><div><strong id="itemCount">—</strong><span>题目记录</span></div><div><strong id="districtCount">—</strong><span>试卷地区</span></div><div class="stats-note" id="coverageNote">正在读取资料库…</div></section>
  <main class="workspace"><nav class="tabs" aria-label="功能切换"><button class="active" data-tab="quiz">知识点出题</button><button data-tab="mistake">错题巩固</button><button data-tab="paper">智能组卷</button><button data-tab="ingest">资料入库</button></nav>
  <div class="content"><section class="intro"><div class="pill" id="modeLabel">01 / 知识点出题</div><h2 id="modeTitle">从一个知识点，开始一组好题。</h2><p id="modeDescription">选择题量与难度，出题老师会查阅已入库的教材依据，并给出答案与解析。</p></section>
  <form id="taskForm"><div class="panel" data-panel="quiz"><label>知识点 <span class="required">*</span><input name="topic" placeholder="例如：集合的基本运算、基本不等式" autocomplete="off"></label><div class="grid two"><label>题目数量<select name="count"><option>1</option><option>5</option><option>10</option><option>20</option></select></label><label>难度<select name="level"><option>中等</option><option>简单</option><option>较难</option><option>拓展</option></select></label></div><label>教材或册次（选填）<input name="book" placeholder="例如：人教 A 版高中数学必修第一册"></label><label class="check"><input type="checkbox" name="questions_only">先只展示题目，作答后再看解析</label></div>
  <div class="panel hidden" data-panel="mistake"><label>错题文字<textarea name="question" rows="4" placeholder="可以直接粘贴题干；有题图时也请上传图片"></textarea></label><label>错题图片或 PDF<input name="mistake_files" type="file" accept=".png,.jpg,.jpeg,.webp,.pdf" multiple><small>支持多张题图；PDF 暂限一份。</small></label><label>你的作答或卡住的步骤（选填）<textarea name="work" rows="3" placeholder="例如：我把交集算成了并集"></textarea></label><div class="grid two"><label>巩固题数量<select name="count"><option>1</option><option>5</option><option>10</option><option>20</option></select></label><label>难度<select name="level"><option value="">与原题相近</option><option>简单</option><option>中等</option><option>较难</option><option>拓展</option></select></label></div><label class="check"><input type="checkbox" name="show_answers">立即展示答案与解析</label></div>
  <div class="panel hidden" data-panel="paper"><div class="grid two"><label>目标年级<input name="grade" placeholder="例如：高一、初二"></label><label>知识范围<input name="scope" placeholder="例如：必修第一册第 1–2 章"></label></div><label>参考试卷（选填）<input name="paper_files" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp" multiple><small>可上传 PDF、Word 或多张试卷图片。</small></label><div class="grid two"><label>试卷标题<input name="title" placeholder="例如：高一数学单元练习"></label><label>整体难度<select name="level"><option value="">按范围或参考卷</option><option>简单</option><option>中等</option><option>较难</option><option>拓展</option></select></label></div><div class="grid three"><label>总题量<input name="question_count" type="number" min="1" placeholder="自动"></label><label>满分<input name="total_score" type="number" min="1" placeholder="自动"></label><label>时长 / 分钟<input name="duration" type="number" min="1" placeholder="自动"></label></div><label class="check"><input type="checkbox" name="questions_only">先只生成学生试卷</label></div>
  <div class="panel hidden" data-panel="ingest"><label>资料类型<select name="kind"><option>教材</option><option>试卷</option></select></label><label>选择文件 <span class="required">*</span><input name="ingest_file" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp"><small>原件会保存在当前项目的资料库中，处理进度可继续追踪。</small></label><label>版本或册次（选填）<input name="edition" placeholder="例如：人教 A 版高中数学必修第一册"></label><label>处理范围<select name="ingest_scope"><option>全量</option><option>目录与题型</option></select></label></div>
  <div class="form-footer"><p id="formHint">答案会逐题验算；尚未核对的教材范围会在结果中说明。</p><button type="submit" id="submitBtn">开始出题 <span>↗</span></button></div></form>
  <section class="result hidden" id="result"><div class="result-head"><div><span class="pill">生成结果</span><h3 id="resultTitle">正在处理</h3></div><button id="copyBtn" type="button" class="ghost hidden">复制结果</button></div><pre id="resultText" aria-live="polite"></pre></section>
  </div></main><footer>出题老师 · 本地运行 · 资料保存在当前项目中</footer>
</div><script src="/app.js"></script></body></html>
